<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <style type="text/css">
    .player-button {
      font-size: 120%;
      width: 30px;
      height: 34px;
      border: none;
      cursor: pointer;
      color: white;
      background: transparent;
      margin: 3px;
    }

    .black-line {
      background-color:black;
    }

    .shadow {
      background: gray;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,1);
      padding: 2px;
    }

    #player {
      display: flex;
      flex-direction: column;
    }
    .player-button i {
      padding: 2px;
    }

    .black-line {
      display: flex;
    }

    .player-time {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-grow: 1;
      margin-left: 2px;
      font-family: "Roboto", sans-serif;
      font-optical-sizing: auto;
      font-weight: <weight>;
      font-style: normal;
      font-variation-settings:
      "wdth" 100;
    }

    .js-progress {
      display: flex;
      align-items: center;
      margin-left: 10px;
      margin-right: 10px;
      flex-grow: 1;
      border-radius: 10px;
      height: 5px;
    }

    .js-progress-slider {
      border-radius: 10px;
      height: 5px;
    }

    .dot {
      height: 9px;
      width: 9px;
      background-color: red;
      border-radius: 100%;
      display: inline-block;
      border-style: solid;
      border-width: 3px;
      border-left-width: 3px;
      border-right-width: 3px;
      border-color: white;
      box-shadow: 2px 2px 2px black;
      margin: -6px;
      opacity: 0;
      transition-property: initial;
      transition-duration: 300ms;
      transition-timing-function: ease-out;
    }

    .black-line:hover .dot {
      transition-duration: initial;
      transition-duration: 300ms;
      transition-timing-function: ease-in;
      opacity: 1;
    }

  </style>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <div id="player" class="shadow" style="width: 800px; height: 600px;"> 

    <div class="js-video-container" style="flex-grow: 1"></div>

    <div class="black-line" style="background-color:black;">
      <button class="player-button js-play-button"> 
        <i class="fa fa-play" aria-hidden="true"></i>
      </button>
      <button class="player-button js-pause-button"> 
        <i class="fa fa-pause" aria-hidden="true"></i>
      </button>
      <button class="player-button js-mute-button">
        <i class="fa fa-volume-up" aria-hidden="true"></i>
      </button>
      <button class="player-button js-volume-button">
        <i class="fa fa-volume-off" aria-hidden="true"></i>
      </button>
      <div class="player-time" style="color: white;">
        <div class="current-time">
          <span class="js-current-time"></span>
        </div>
        <div class="js-progress">
          <div class="js-progress-slider" style="background-color: red;"></div>
          <span class="dot"></span>
        </div>  
        <div class="duration">
          <span class="player-time js-duration"></span>
        </div>
      </div>
      <button class="player-button js-fullscreen-button">
        <i class="fa fa-expand" aria-hidden="true"></i>
      </button>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
    <script src="player.js"></script>

    <script type="text/javascript">
    createPlayer({elementId: 'player'});
  </script>
</body>
</html>
